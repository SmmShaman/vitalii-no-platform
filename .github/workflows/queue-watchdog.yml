name: Publish Queue Watchdog

on:
  schedule:
    # Run every 10 minutes — cleans zombie articles and handles stale scheduled items
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest

    # Self-hosted Supabase: base URL + service_role key come from repo secrets
    # (no Management API on a self-hosted stack — this used to query the old
    # uchmopqiylywnemvjttl project via scripts/bypass/db.mjs, which has been
    # dead/402 since 2026-07-15).
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SRV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check credentials
        run: |
          if [ -z "$SRV" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set"
            exit 1
          fi

      - name: Zombie cleanup & schedule backup
        run: |
          echo "🧟 Queue Watchdog — $(date -u '+%H:%M UTC')"

          CUTOFF=$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%S.000Z')
          STALE_CUTOFF=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%S.000Z')

          # Clean zombies: stuck mid-pipeline for more than 10 minutes
          ZOMBIES=$(curl -fsS \
            -X PATCH "$SUPABASE_URL/rest/v1/news?auto_publish_status=in.(pending,variant_selection,image_generation,content_rewrite,social_posting)&auto_publish_started_at=lt.$CUTOFF" \
            -H "apikey: $SRV" \
            -H "Authorization: Bearer $SRV" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"auto_publish_status":"failed","auto_publish_error":"Zombie: watchdog auto-cleaned after 10min timeout"}')
          ZOMBIE_COUNT=$(echo "$ZOMBIES" | jq 'length')
          echo "🧟 Cleaned $ZOMBIE_COUNT zombie(s)"

          # Clean stale scheduled (>24h, never picked up)
          STALE=$(curl -fsS \
            -X PATCH "$SUPABASE_URL/rest/v1/news?auto_publish_status=eq.scheduled&scheduled_publish_at=lt.$STALE_CUTOFF" \
            -H "apikey: $SRV" \
            -H "Authorization: Bearer $SRV" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"auto_publish_status":"failed","auto_publish_error":"Stale: scheduled >24h ago, never picked up"}')
          STALE_COUNT=$(echo "$STALE" | jq 'length')
          echo "📅 Cleaned $STALE_COUNT stale scheduled article(s)"

          echo "✅ Watchdog complete"
