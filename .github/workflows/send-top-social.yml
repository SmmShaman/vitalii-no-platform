name: Send Top Social

on:
  schedule:
    - cron: '0 6 * * *'  # 08:00 Oslo summer (CEST=UTC+2), 07:00 winter
  workflow_dispatch:

jobs:
  send-top-social:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Invoke send-top-social Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔥 Send Top Social — $(date -u '+%H:%M UTC')"

          # Self-hosted Supabase: service_role key comes from repo secrets
          # (no Management API on a self-hosted stack).
          if [ -z "$SRV" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set"
            exit 1
          fi

          # Edge Function picks yesterday's top-N by linkedin_score and schedules them
          # with preset_config (linkedin+facebook+instagram) for schedule-publisher.
          RESPONSE=$(curl -fsS --max-time 90 \
            -X POST "$SUPABASE_URL/functions/v1/send-top-social" \
            -H "Authorization: Bearer $SRV" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.success == true' >/dev/null || { echo "::error::Edge Function reported failure"; exit 1; }

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"❌ Send Top Social failed! Run: ${RUN_URL}\"}"
