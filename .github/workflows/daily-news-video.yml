name: Daily News Video

on:
  # Daily cron: 07:00 Oslo (05:00 UTC summer CEST, 06:00 UTC winter CET)
  # Triggers auto_digest → bot sends script for approval → moderator approves → render
  schedule:
    - cron: '0 5 * * *'  # 07:00 Oslo (summer CEST=UTC+2)
    - cron: '0 6 * * *'  # 07:00 Oslo (winter CET=UTC+1)

  # Telegram bot triggers render via repository_dispatch (after moderator approval)
  repository_dispatch:
    types: [daily-video-render]

  # Manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: auto_digest (LLM selects + script) or render (full video)'
        required: true
        default: 'auto_digest'
        type: choice
        options:
          - auto_digest
          - render
      language:
        description: 'Video language (render mode only)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'    # Norwegian
          - 'en'    # English
      format:
        description: 'Video format (render mode only)'
        required: true
        default: 'horizontal'
        type: choice
        options:
          - horizontal  # 1920x1080 (YouTube/LinkedIn)
          - vertical    # 1080x1920 (Shorts/Reels/TikTok)
      target_date:
        description: 'Target date (YYYY-MM-DD), default: yesterday'
        required: false
        type: string
      youtube_privacy:
        description: 'YouTube privacy (render mode only)'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      skip_images:
        description: 'Skip background images (effects-only mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_youtube:
        description: 'Skip YouTube upload (save as artifact only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ── Job 1: Auto Digest (cron + manual auto_digest mode) ──
  # Calls Edge Function to: fetch articles → LLM ranks top-10 → writes script → sends to bot
  auto-digest:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'auto_digest')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger auto digest via Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date || '' }}"
          QUERY="action=auto_digest"
          if [ -n "$TARGET_DATE" ]; then
            QUERY="${QUERY}&target_date=${TARGET_DATE}"
          fi

          echo "🤖 Calling auto_digest..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${SUPABASE_URL}/functions/v1/daily-video-bot?${QUERY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -X POST -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response ($HTTP_CODE): $BODY"

          # Gateway timeouts (Kong 504 / Cloudflare 524) cut the connection at
          # ~60-100s while the Edge Function keeps working and dispatches the
          # render itself. Poll the draft row before declaring failure.
          if [ "$HTTP_CODE" = "504" ] || [ "$HTTP_CODE" = "524" ]; then
            DATE="${TARGET_DATE:-$(date -u -d yesterday +%F)}"
            echo "⏳ Gateway timeout — polling draft for ${DATE} to see if the function is still working..."
            for i in 1 2 3 4; do
              sleep 60
              STATUS=$(curl -s "${SUPABASE_URL}/rest/v1/daily_video_drafts?target_date=eq.${DATE}&select=status" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" | \
                sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
              echo "   poll ${i}/4: draft status = ${STATUS:-none}"
              if [ -n "$STATUS" ] && [ "$STATUS" != "pending_digest" ]; then
                echo "✅ Auto digest is progressing in the background (status: ${STATUS})"
                exit 0
              fi
            done
            echo "❌ Auto digest timed out and the draft never advanced"
            exit 1
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Auto digest failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Auto digest triggered successfully"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"❌ <b>Auto digest failed!</b>\n\n🔗 <a href=\\\"${RUN_URL}\\\">View logs</a>\", \"parse_mode\": \"HTML\", \"disable_web_page_preview\": true}"

  # ── Job 2: Render Video (repository_dispatch from bot + manual render mode) ──
  render-video:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'render')
    runs-on: ubuntu-latest
    # The pipeline grew a research pass, fact verification and stock b-roll:
    # the 09.08 comparison renders took 47-52 minutes, too close to the old
    # 60-minute cap for a run nobody is watching.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome dependencies (for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 ffmpeg

      - name: Install video-processor dependencies
        working-directory: ./scripts/video-processor
        run: npm ci

      - name: Install Remotion project dependencies
        working-directory: ./scripts/remotion-video
        run: npm ci

      # Voiceover moved off the paid reseller on 2026-09-05 — same Microsoft
      # voices, no balance to run out, and real word timings for the captions.
      - name: Install edge-tts (voiceover)
        run: python3 -m pip install --quiet edge-tts

      - name: Generate daily news compilation
        working-directory: ./scripts/video-processor
        env:
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # LLM (NVIDIA NIM primary → free Gemini → Claude)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # llm-helper's middle fallback. Never passed before, so on 2026-08-10
          # the chain was NVIDIA (aborting at 120s) → Claude (no credits) and the
          # Visual Director died on all 7 segments.
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Google AI (Gemini — LLM fallback + thumbnail)
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # TTS (Zvukogram)
          ZVUKOGRAM_TOKEN: ${{ secrets.ZVUKOGRAM_TOKEN }}
          ZVUKOGRAM_EMAIL: ${{ secrets.ZVUKOGRAM_EMAIL }}

          # Avatar (fal.ai EchoMimicV3)
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ENABLE_AVATAR: ${{ secrets.ENABLE_AVATAR || 'false' }}
          AVATAR_SOURCE_PHOTO_URL: ${{ secrets.AVATAR_SOURCE_PHOTO_URL }}

          # Pexels (stock images + b-roll)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # Cloudflare (thumbnail fallback via FLUX)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '1438e8d03009209c4a82ea4c28bdb358' }}

          # Google Custom Search (per-phrase contextual image search)
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}

          # Telegram (completion notification)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Video settings
          LANGUAGE: ${{ github.event.client_payload.language || github.event.inputs.language || 'no' }}
          FORMAT: ${{ github.event.client_payload.format || github.event.inputs.format || 'horizontal' }}
          TARGET_DATE: ${{ github.event.client_payload.target_date || github.event.inputs.target_date || '' }}
          DRAFT_ID: ${{ github.event.client_payload.draft_id || '' }}
          YOUTUBE_PRIVACY: ${{ github.event.client_payload.youtube_privacy || github.event.inputs.youtube_privacy || 'public' }}
          SKIP_YOUTUBE: ${{ github.event.client_payload.skip_youtube || github.event.inputs.skip_youtube || 'false' }}
          SKIP_IMAGES: ${{ github.event.client_payload.skip_images || github.event.inputs.skip_images || 'false' }}
        run: node daily-compilation.js

      - name: Save video as artifact (YouTube fallback)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: scripts/video-processor/daily-video-*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET="${{ github.event.client_payload.target_date || github.event.inputs.target_date || 'yesterday' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"❌ <b>Video render failed!</b>\n\n📅 Date: ${TARGET}\n🔗 <a href=\\\"${RUN_URL}\\\">View logs</a>\", \"parse_mode\": \"HTML\", \"disable_web_page_preview\": true}"

      - name: Report results
        if: always()
        run: |
          echo "Daily news video generation completed"
          echo "Language: ${{ github.event.inputs.language || 'no' }}"
          echo "Format: ${{ github.event.inputs.format || 'horizontal' }}"
