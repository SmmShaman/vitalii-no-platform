name: Auto-reject stale news

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  auto-reject:
    runs-on: ubuntu-latest

    # Self-hosted Supabase: base URL + service_role key come from repo secrets
    # (no Management API on a self-hosted stack — the old uchmopqiylywnemvjttl
    # project this used to query via scripts/bypass/db.mjs has been dead/402
    # since 2026-07-15).
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SRV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check credentials
        run: |
          if [ -z "$SRV" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set"
            exit 1
          fi

      - name: Auto-reject stale news
        id: reject
        run: |
          echo "🤖 Auto-reject stale news — $(date -u '+%H:%M UTC')"

          CUTOFF=$(date -u -d '48 hours ago' '+%Y-%m-%dT%H:%M:%S.000Z')

          # Reject pending articles older than 48h.
          # Important: only reject articles that are NOT already published —
          # otherwise we end up with the buggy state is_published=true +
          # pre_moderation_status='rejected' which makes broken/empty rows
          # appear at the top of the public feed.
          PENDING=$(curl -fsS \
            -X PATCH "$SUPABASE_URL/rest/v1/news?pre_moderation_status=eq.pending&created_at=lt.$CUTOFF&or=(is_published.eq.false,is_published.is.null)" \
            -H "apikey: $SRV" \
            -H "Authorization: Bearer $SRV" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"pre_moderation_status":"rejected","rejection_reason":"Auto-rejected: pending for more than 48 hours"}')
          PENDING_COUNT=$(echo "$PENDING" | jq 'length')
          echo "📊 Rejected $PENDING_COUNT pending-stale articles"

          # Reject approved-but-unpublished articles older than 48h
          APPROVED=$(curl -fsS \
            -X PATCH "$SUPABASE_URL/rest/v1/news?pre_moderation_status=eq.approved&created_at=lt.$CUTOFF&published_at=is.null&or=(is_published.eq.false,is_published.is.null)" \
            -H "apikey: $SRV" \
            -H "Authorization: Bearer $SRV" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"pre_moderation_status":"rejected","rejection_reason":"Auto-rejected: approved but not published within 48 hours"}')
          APPROVED_COUNT=$(echo "$APPROVED" | jq 'length')
          echo "📊 Rejected $APPROVED_COUNT approved-stale articles"

          TOTAL=$((PENDING_COUNT + APPROVED_COUNT))
          echo "📊 Total rejected: $TOTAL"
          echo "REJECTED_COUNT=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## Auto-reject Stale News Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejected:** ${{ steps.reject.outputs.REJECTED_COUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "News items pending or approved but not published within 48 hours are automatically rejected." >> $GITHUB_STEP_SUMMARY
