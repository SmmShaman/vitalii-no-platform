name: Build site for VPS

# vitalii.no is served from the Contabo VPS since 2026-09-26 (Netlify Free ran out
# of function invocations to crawlers and blocked every site on the account).
# This job only builds; the VPS pulls the artifact itself (deploy/vps/deploy.sh,
# vitalii-site-deploy.timer), so no SSH key has to live in GitHub.

on:
  push:
    branches:
      - main
    # The nightly feature-clip factory pushes under scripts/; the site does not read it.
    paths-ignore:
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://vitalii.no
          NEXT_PUBLIC_GTM_ID: GTM-5XBL8L8S

      - name: Package standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf site.tar.gz -C .next/standalone .
          ls -lh site.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-standalone
          path: site.tar.gz
          retention-days: 5
